<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-02 · s20 南山成长时光轴</title>
<style>
  :root{--ink:#f3f6fb;--gold:#e8c877;--era:#a3d8ea}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);line-height:1.75;background:#4c432b;transition:background 1.1s ease}
  a{color:inherit;text-decoration:none}

  .hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:baseline;padding:16px clamp(16px,5vw,44px)}
  .yr{font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:clamp(38px,10vw,96px);color:#fff;text-shadow:0 2px 26px #0009;letter-spacing:-.02em}
  .yr small{font-size:.28em;color:#ffffffbb;margin-left:8px;font-weight:800;letter-spacing:.2em}
  .hud .brand{font-size:13px;letter-spacing:.16em;color:#eef2f7;font-weight:800;text-align:right}
  .hud .brand b{color:var(--gold)}
  .hud .brand em{display:block;font-style:normal;font-weight:500;color:#ffffffaa;margin-top:2px;letter-spacing:.12em;font-size:11px}

  .rail{position:fixed;right:clamp(14px,4vw,44px);top:120px;bottom:70px;width:2px;background:#ffffff33;z-index:4}
  .rail i{position:absolute;left:-4px;width:10px;height:10px;border-radius:50%;background:#ffffff55;transition:.3s}
  .rail i.lit{background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .marker{position:fixed;right:clamp(9px,4vw,39px);top:120px;z-index:6;font-size:18px;transition:transform .12s linear;will-change:transform}
  .marker::after{content:"🕰️"}

  .step{min-height:92vh;display:flex;align-items:center;padding:0 clamp(24px,10vw,150px)}
  .step .no{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.24em;color:#ffffffa8}
  .step .era{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.2em;padding:4px 12px;border-radius:999px;background:#ffffff22;border:1px solid #ffffff33;margin-left:8px;color:var(--era)}
  .step h2{font-size:clamp(26px,5.6vw,54px);font-weight:900;line-height:1.08;margin:10px 0 6px;text-shadow:0 4px 28px #0008;letter-spacing:-.005em}
  .step .tag{color:var(--gold);font-weight:800;font-size:clamp(14px,2vw,17px);letter-spacing:.06em}
  .step p{font-size:clamp(14px,2.2vw,18px);margin-top:16px;max-width:52ch;opacity:.96;text-shadow:0 2px 12px #0008}
  .step .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .step .chips span{font-size:12.5px;font-family:ui-monospace,monospace;padding:5px 12px;border-radius:8px;background:#ffffff14;border:1px solid #ffffff2a;color:#eaf3f9;font-weight:600}
  .step .body{opacity:.15;transform:translateY(30px);transition:.9s cubic-bezier(.2,.7,.2,1)}
  .step.on .body{opacity:1;transform:none}

  .end{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .end h2{font-size:clamp(30px,7vw,72px);font-weight:900;color:var(--gold);letter-spacing:.02em}
  .end .slogan{font-size:clamp(18px,3vw,26px);color:#fff;margin-top:8px;letter-spacing:.32em}
  .end p{max-width:52ch;color:#f0ead6;margin-top:18px;font-size:clamp(15px,2.4vw,20px);line-height:1.9}
  .end .up{margin-top:28px;font-weight:800;padding:12px 26px;border:1.5px solid #ffffff66;border-radius:999px}
  .end .srcs{margin-top:34px;font-size:11px;color:#ffffffa8;max-width:64ch;line-height:1.8;text-align:left;background:#ffffff08;border:1px solid #ffffff18;border-radius:12px;padding:14px 18px}
  .end .srcs b{color:var(--gold);display:block;margin-bottom:6px;letter-spacing:.1em;font-size:11px}
  .end .srcs a{color:#cfe4f5;text-decoration:underline;text-underline-offset:2px}
  .foot{position:fixed;left:16px;bottom:12px;z-index:5;font-size:11px;color:#ffffff77}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.step .body{transition:none;opacity:1;transform:none}}
  @media(max-width:640px){.rail,.marker{display:none}}
</style>
</head>
<body>
  <div class="hud">
    <div class="yr"><span id="yr">1979</span><small>年</small></div>
    <div class="brand">南山 · <b>成长时光轴</b><em>向下滚 · 穿越 47 年</em></div>
  </div>
  <div class="rail" id="rail"></div>
  <div class="marker" id="marker" aria-hidden="true"></div>
  <div class="foot">内容全部来自官方与公开报道整理 · 只借"沿线索滚动推进"的交互范式，线索是南山自身的发展年代 · s20 by Qoder</div>

  <main id="journey"></main>

<script>
  // 12 个可查证的南山里程碑 · 来源见文末（阶段 4 · 破冰 · 生长 · 成势 · 领跑）
  const S=[
    {y:1979,bg:'#4c432b',era:'破冰',t:'蛇口工业区启动建设',
      tag:'中华人民共和国首个对外开放工业区',
      d:'1979 年 1 月，国务院批准招商局自筹资金开发蛇口工业区；7 月 8 日，蛇口工业区基础工程动土启建。"时间就是金钱，效率就是生命"的口号从这里传出，成为中国改革开放的重要序章。',
      c:['1979.1 · 国务院批准','7.8 · 基础工程动土','口号 · 时间就是金钱']},
    {y:1980,bg:'#4a5a2b',era:'破冰',t:'深圳经济特区设立',
      tag:'改革试验田',
      d:'1980 年 8 月，中央批准设立深圳经济特区，南山地域从此进入特区范围。一个边陲农业地带，被推向中国改革开放的最前沿——"杀出一条血路"，就从这片海岸开始。',
      c:['1980.8','四个经济特区之一','改革试验田']},
    {y:1990,bg:'#3b6252',era:'破冰',t:'南山区正式设立',
      tag:'建区',
      d:'1990 年 1 月，国务院批准设立南山区，管辖原南头区与蛇口区行政区域；同年 9 月，南山区正式成立。一个完整的城市骨架，从这一天起沿袭至今。',
      c:['1990.1 · 国务院批准','1990.9 · 正式成立','现辖 8 街道 101 社区']},
    {y:1996,bg:'#2b6079',era:'生长',t:'深圳高新区获批成立',
      tag:'科技是第一生产力',
      d:'1996 年 9 月，深圳高新技术产业园区获批成立，规划面积 11.5 平方公里，入选国家科技部"建设世界一流高科技园区"首批试点。前身是 1985 年中科院与深圳市政府合办的深圳科技工业园——"科技是第一生产力"从一句口号，变成这片城区最硬的基因。',
      c:['1996.9','规划 11.5 km²','国家首批试点园区']},
    {y:1999,bg:'#1f5c7f',era:'生长',t:'首届高交会 · 腾讯拿到第一笔关键投资',
      tag:'创新火种',
      d:'1999 年，第一届中国国际高新技术成果交易会在深圳举办。一家年轻的创业团队在这里拿到发展史上第一笔关键投资，熬过了最艰难的日子——那家公司，叫腾讯。"中国硅谷"的火种，就这样被点燃。',
      c:['1999 · 首届高交会','腾讯获第一笔关键投资','中国硅谷的火种']},
    {y:2001,bg:'#1a5c86',era:'生长',t:'大学城落子西丽',
      tag:'科教基因',
      d:'2001 年起，清华大学、北京大学、哈尔滨工业大学的深圳研究生院相继落地西丽。科教、人才、产业第一次在同一片湖水周边交汇——今天"西丽湖国际科教城"的雏形，就在这里成形。',
      c:['2001–2002','清华 / 北大 / 哈工大深圳研究生院','西丽湖国际科教城的前身']},
    {y:2006,bg:'#155d86',era:'生长',t:'大疆在南山的仓库里诞生',
      tag:'敢闯敢试',
      d:'一位 80 后创业者在南山不足 20 平方米的仓库里捣鼓飞行器——消费级无人机这个全新行业，从无到有。"人们选南山，不是因为这里已经很好，而是因为这里无条件支持敢闯敢试的人。"',
      c:['2006','不足 20 m² 起步','消费级无人机全球份额 70%+']},
    {y:2010,bg:'#1c6a86',era:'成势',t:'前海开发上升为国家战略',
      tag:'国家级平台',
      d:'2010 年 8 月 26 日——深圳经济特区成立 30 周年当天，国务院批复同意《前海深港现代服务业合作区总体发展规划》。"依托香港、服务内地、面向世界"，前海从一片滩涂，被写进国家战略。',
      c:['2010.8.26','国务院批复','国家级战略平台']},
    {y:2017,bg:'#0b7a86',era:'成势',t:'深圳人才公园开园',
      tag:'深爱人才 · 圳等您来',
      d:'2017 年 11 月 1 日，首个"深圳人才日"当天，全国第一个以"人才"命名的主题公园在南山后海开放。占地约 77 万平方米、水体约 30 万平方米，与深圳湾超级总部基地隔路相望；星光桥上 30 根星光柱，向这座城市里最好的人致敬。',
      c:['2017.11.1 · 全国首个','约 77 万 m²','星光桥 · 30 根星光柱']},
    {y:2021,bg:'#0a5cff',era:'成势',t:'前海扩区 · 几乎"扩大 8 倍"',
      tag:'改革开放再出发',
      d:'2021 年 9 月 6 日，中共中央、国务院印发《全面深化前海深港现代服务业合作区改革开放方案》。前海合作区总面积由 14.92 平方公里扩展至 120.56 平方公里——几乎"扩大 8 倍"。空间打开了，改革的想象力也随之打开。',
      c:['2021.9.6','14.92 → 120.56 km²','扩大约 8 倍']},
    {y:2025,bg:'#0b5c73',era:'领跑',t:'GDP 突破 1.01 万亿元',
      tag:'全国首个万亿 GDP 地市辖区',
      d:'2025 年，南山区 GDP 约 1.01 万亿元，成为全国首个 GDP 破万亿的地市辖区。陆域 185.3 平方公里的土地上，装着 218 家上市公司、6037 家国家高新技术企业、研发投入强度 7.87%——中国硅谷的成色，就在这片山海之间。',
      c:['GDP 1.01 万亿','上市公司 218','国家高企 6037','研发投入 7.87%']},
    {y:2026,bg:'#8a6a1a',era:'领跑',t:'走向亚太 · APEC 主办城区',
      tag:'乘大势 · 共翱翔',
      d:'2026 年 11 月 18 日至 19 日，亚太经合组织（APEC）第三十三次领导人非正式会议将在深圳举行。南山作为主办城区，把 47 年改革开放的答卷，递向亚太 21 个经济体——会标里的鲲鹏，正源于这座城市的名字：鹏城。',
      c:['2026.11.18–19','APEC 中国年','主办城区 · 南山']},
  ];

  const D=S.map(s=>s.y), N=S.length;
  const journey=document.getElementById('journey');
  S.forEach((s,i)=>{
    const sec=document.createElement('section');
    sec.className='step'; sec.dataset.bg=s.bg;
    sec.innerHTML='<div class="body">'+
      '<div class="no">MILESTONE '+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'<span class="era">'+s.era+'</span></div>'+
      '<h2>'+s.t+'</h2>'+
      '<div class="tag">'+s.tag+'</div>'+
      '<p>'+s.d+'</p>'+
      '<div class="chips">'+s.c.map(c=>'<span>'+c+'</span>').join('')+'</div>'+
      '</div>';
    journey.appendChild(sec);
  });
  // 结尾 · 来源
  const end=document.createElement('section');
  end.className='end'; end.dataset.bg='#2d2109';
  end.innerHTML='<h2>下一站，是海，也是世界</h2>'+
    '<div class="slogan">乘大势 · 共翱翔</div>'+
    '<p>从蛇口的一声炮响，到 APEC 的 21 根羽翼——南山用 47 年，把自己从滩涂写成湾区。<br>再往下，故事由你继续。</p>'+
    '<div class="srcs"><b>资料来源（公开可查 · 官方口径优先）</b>'+
      '① 深圳市南山区人民政府 · <a href="https://www.szns.gov.cn/mlns/nsgk/content/post_12950917.html" target="_blank" rel="noopener">行政区划（1990 年 1 月国务院批准设立南山区）</a><br>'+
      '② 中国政府网 · <a href="https://www.gov.cn/yaowen/liebiao/202512/content_7051058.htm" target="_blank" rel="noopener">APEC 第三十三次领导人非正式会议将于 2026 年 11 月 18—19 日在深圳举行</a><br>'+
      '③ 经济日报 · <a href="https://www.jingjiribao.cn/static/detail.jsp?id=634611" target="_blank" rel="noopener">深圳南山区成为全国首个县（区）级 GDP 万亿城区</a><br>'+
      '④ 新华社受权发布 · 2021 年 9 月 6 日《全面深化前海深港现代服务业合作区改革开放方案》（14.92 → 120.56 km²）<br>'+
      '⑤ 中国政府网 / 国务院 · 2010 年 8 月 26 日批复《前海深港现代服务业合作区总体发展规划》<br>'+
      '⑥ 维基百科 · 南山区（蛇口工业区 1979.7.8 动土、深圳经济特区 1980.8 设立等条目）<br>'+
      '⑦ 深圳新闻网 / 南方都市报 · 全国首个"人才"主题公园——深圳人才公园 2017 年 11 月 1 日开园<br>'+
      '⑧ 创新南山 · 南山八景（2026 年 9 月揭晓）；高交会 1999 首届、腾讯早期获投、大疆 2006 南山车库起步——公开报道整理</div>'+
    '<a class="up" onclick="scrollTo({top:0,behavior:\'smooth\'});return false" href="#">↑ 回到 1979</a>';
  journey.appendChild(end);

  const steps=[...document.querySelectorAll('.step')];
  const yrEl=document.getElementById('yr'), rail=document.getElementById('rail'), marker=document.getElementById('marker');
  S.forEach((s,i)=>{const d=document.createElement('i');d.style.top=(i/(N-1)*100)+'%';rail.appendChild(d);});
  const dots=[...rail.children];

  function tick(){
    const vh=innerHeight, total=journey.scrollHeight;
    const scrolled=Math.min(total-vh, Math.max(0, scrollY - journey.offsetTop));
    const p=scrolled/total;
    const idxF=p*(N-1), lo=Math.floor(idxF), hi=Math.min(N-1,lo+1), fr=idxF-lo;
    yrEl.textContent=Math.round(D[lo]+(D[hi]-D[lo])*fr);
    let bg=S[Math.min(N-1,Math.round(idxF))].bg;
    steps.forEach(s=>{const r=s.getBoundingClientRect(); if(r.top<=vh*0.5 && r.bottom>=vh*0.5) bg=s.dataset.bg;});
    if(steps[N-1].getBoundingClientRect().bottom<=vh*0.5) bg=end.dataset.bg;
    document.body.style.background=bg;
    dots.forEach((d,i)=>d.classList.toggle('lit', p+0.001>=i/(N-1)));
    marker.style.transform=`translateY(${p*(rail.getBoundingClientRect().height)}px)`;
    steps.forEach(s=>{const r=s.getBoundingClientRect(); if(r.top<vh*0.72 && r.bottom>vh*0.2) s.classList.add('on');});
  }
  addEventListener('scroll',tick,{passive:true});addEventListener('resize',tick);
  document.body.style.background=S[0].bg;tick();
</script>
</body>
</html>
