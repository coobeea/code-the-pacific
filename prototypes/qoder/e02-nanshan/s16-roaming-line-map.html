<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-02 · s16 南山漫游线路图</title>
<style>
  :root{--ink:#0e1a2b;--mut:#5b7089;--sea:#0b5c73;--line:#e4ebf2;--gold:#c9962a;--park:#3f7d54;--data:#0a5cff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);background:#f6f8fb;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:clamp(22px,4vw,44px)}
  .kick{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--sea);font-weight:800}
  h1{font-size:clamp(28px,5vw,48px);font-weight:900;margin-top:6px}
  .sub{color:var(--mut);margin-top:8px;max-width:56ch}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0 6px;font-size:12px;color:var(--mut)}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px}

  .mapcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px clamp(10px,2vw,22px);box-shadow:0 12px 34px #143a5a10;overflow-x:auto}
  svg{display:block;min-width:860px;height:auto}
  .st{cursor:pointer}
  .st circle{fill:#fff;stroke-width:5;transition:.2s}
  .st .ring{fill:#fff;stroke:#0b5c73}
  .st:hover circle.ring,.st.on circle.ring{stroke:var(--gold)}
  .st.on circle.dot{fill:var(--gold)}
  .st text{font-size:13px;font-weight:700;fill:#0e1a2b;font-family:inherit}
  .st .no{font-size:11px;fill:#fff;font-weight:800;text-anchor:middle}

  .detail{margin-top:18px;display:grid;grid-template-columns:1fr;gap:0;background:#fff;border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:18px;padding:22px clamp(18px,3vw,30px);box-shadow:0 10px 26px #143a5a0d}
  .d-top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
  .d-top .cat{font-size:12px;font-weight:800;letter-spacing:.16em;color:#fff;background:var(--sea);padding:4px 12px;border-radius:999px}
  .d-top h2{font-size:clamp(26px,4vw,42px);font-weight:900}
  .d-top .from{font-size:12px;color:var(--mut);font-family:ui-monospace,monospace}
  .d-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .d-blk h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
  .d-blk p{font-size:14px;line-height:1.8}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .tags span{font-size:13px;padding:6px 12px;border-radius:10px;background:#f0f4f8;font-weight:600}
  .info{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px;padding-top:16px;border-top:1px dashed #d7e0ea}
  .info .it{display:flex;flex-direction:column}
  .info .it b{font-size:20px;color:var(--gold)}
  .info .it span{font-size:12px;color:var(--mut)}
  .info .it.t b{color:var(--data);font-size:14px;font-weight:700;max-width:34ch}
  .note{margin-top:16px;font-size:12px;color:var(--mut)}
  @media(max-width:720px){.d-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="kick">NANSHAN ROAMING LINE · 南山漫游 1 号线</div>
    <h1>跟着线路，一路看完南山八景</h1>
    <p class="sub">把「南山八景」画成一张地铁式漫游线路图——点任意站点，展开它的看点、建议时长与交通。像查攻略一样，一站一站往下走。</p>

    <div class="legend">
      <span><i style="background:#0b5c73"></i>海 · 滨海</span>
      <span><i style="background:#3f7d54"></i>河 · 湿地</span>
      <span><i style="background:#c9962a"></i>城 · 人文</span>
      <span><i style="background:#0a5cff"></i>湖 · 科教</span>
    </div>

    <div class="mapcard">
      <svg id="line" viewBox="0 0 900 260" role="img" aria-label="南山八景漫游线路图"></svg>
    </div>

    <div class="detail" id="detail"></div>
    <p class="note">注：线路为概念串联，非实际轨道交通；建议时长与交通为参考，请以官方与实地为准。数据来源：深圳市南山区人民政府 / 创新南山。</p>
  </div>

<script>
  const S=[
    {n:'古城宁南',cat:'城',c:'#c9962a',look:'南头古城近 1700 年深港之根，中山公园、荷兰花卉小镇串起人文创意带。',dur:'2 小时',metro:'地铁 12 号线沿线',pts:['南头古城','中山公园','荷兰花卉小镇'],tip:'古城文创咖啡、夜市'},
    {n:'燕晗栖羽',cat:'河',c:'#3f7d54',look:'大沙河生态长廊一路奔海，华侨城国家湿地与创意文化园相伴。',dur:'半天',metro:'地铁 1 号线 华侨城站',pts:['大沙河长廊','华侨城湿地','世界之窗','欢乐海岸'],tip:'湿地观鸟、OCAT 看展'},
    {n:'丽湖留仙',cat:'湖',c:'#0a5cff',look:'西丽湖环湖碧道 15.5 公里，科教城与留仙洞总部基地在山水之间。',dur:'2–3 小时',metro:'地铁 5/7 号线 西丽站',pts:['西丽湖','西丽湖国际科教城','留仙洞总部基地'],tip:'环湖骑行'},
    {n:'前海观潮',cat:'城',c:'#c9962a',look:'前海石公园与国际会议中心，深港合作前沿的天际线。',dur:'1–2 小时',metro:'地铁 5/11 号线 前海湾站',pts:['前海石公园','前海国际会议中心','万象前海'],tip:'看前海夜景'},
    {n:'蛇口记忆',cat:'海',c:'#0b5c73',look:'招商局与海上世界，从渔镇到湾区门户的改革开放地标群。',dur:'半天',metro:'地铁 2 号线 海上世界站',pts:['海上世界','南海意库','价值工厂','K11 ECOAST'],tip:'蛇口海鲜、老街'},
    {n:'伶仃烟渚',cat:'海',c:'#0b5c73',look:'赤湾天后宫、大小南山与内伶仃岛，文天祥零丁洋的历史回响。',dur:'半天',metro:'地铁 2/5 号线 赤湾站',pts:['赤湾天后宫','大小南山','内伶仃岛'],tip:'登高望伶仃洋'},
    {n:'深湾驭风',cat:'海',c:'#0b5c73',look:'深圳湾公园滨海绿道，43.7 公里黄金海岸线的一段，落日与候鸟。',dur:'2 小时',metro:'地铁 9 号线沿线',pts:['深圳湾公园','深圳湾滨海绿道','深圳湾大桥'],tip:'看海、看落日'},
    {n:'后海逐浪',cat:'海',c:'#0b5c73',look:'深圳湾超级总部基地与人才公园，湾区对外的城市客厅。',dur:'半天',metro:'地铁 2/11 号线 后海站',pts:['深圳人才公园','中国华润大厦','万象城','春笋'],tip:'春笋夜景、灯光秀'},
  ];
  const W=900,x0=58,x1=842,step=(x1-x0)/(S.length-1);
  const svg=document.getElementById('line');
  // 折线（之字形）
  const pts=S.map((s,i)=>({x:x0+i*step, y:i%2===0?82:178}));
  let pl='M '+pts[0].x+' '+pts[0].y;
  pts.forEach(p=>pl+=' L '+p.x+' '+p.y);
  let out='<path d="'+pl+'" fill="none" stroke="#c7d4e2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>';
  out+='<path d="'+pl+'" fill="none" stroke="#0b5c73" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".18"/>';
  S.forEach((s,i)=>{
    const p=pts[i];
    out+='<g class="st" data-i="'+i+'">'+
      '<circle class="ring" cx="'+p.x+'" cy="'+p.y+'" r="15" stroke="'+s.c+'"/>'+
      '<circle class="dot" cx="'+p.x+'" cy="'+p.y+'" r="9" fill="'+s.c+'"/>'+
      '<text class="no" x="'+p.x+'" y="'+(p.y+4)+'">'+(i+1)+'</text>'+
      '<text x="'+p.x+'" y="'+(i%2===0?p.y-26:p.y+40)+'" text-anchor="middle">'+s.n+'</text>'+
      '</g>';
  });
  svg.innerHTML=out;
  const detail=document.getElementById('detail');
  function show(i){
    const s=S[i];
    detail.style.borderLeftColor=s.c;
    document.querySelectorAll('.st').forEach(g=>g.classList.toggle('on',+g.dataset.i===i));
    detail.innerHTML=
      '<div class="d-top"><div><div class="from">STATION '+String(i+1).padStart(2,'0')+' / 08</div><h2>'+s.n+'</h2></div>'+
      '<span class="cat" style="background:'+s.c+'">'+s.cat+'</span></div>'+
      '<div class="d-grid"><div class="d-blk"><h4>看点</h4><p>'+s.look+'</p></div>'+
      '<div class="d-blk"><h4>代表景点</h4><div class="tags">'+s.pts.map(t=>'<span>'+t+'</span>').join('')+'</div></div></div>'+
      '<div class="info"><div class="it"><b>'+s.dur+'</b><span>建议时长</span></div>'+
      '<div class="it t"><b>'+s.metro+'</b><span>交通参考</span></div>'+
      '<div class="it t"><b>'+s.tip+'</b><span>玩法 tip</span></div></div>';
  }
  svg.querySelectorAll('.st').forEach(g=>g.addEventListener('click',()=>show(+g.dataset.i)));
  show(0);
</script>
</body>
</html>
