<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-02 南山名片 · s11 八景一张图（原创交互）</title>
<style>
  :root{--sea:#bfe3ee;--sea2:#8fcfe0;--land:#f0ead8;--park:#cfe6c4;--ink:#20342a;--g2:#5c7062;--brand:#0b6b53;--pin:#c0392b;--gold:#c9962a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Songti SC",Georgia,"PingFang SC",sans-serif;background:#faf7ef;color:var(--ink);line-height:1.6}
  a{text-decoration:none;color:inherit}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,44px);border-bottom:2px solid var(--brand);font-size:14px}
  .bar .k{color:var(--brand);font-weight:700;letter-spacing:.06em}
  .wrap{max-width:1160px;margin:0 auto;padding:clamp(16px,3vw,32px) clamp(16px,4vw,44px) 44px}
  .head{text-align:center;margin:8px 0 20px}
  .head h1{font-size:clamp(26px,5vw,44px);font-weight:800}
  .head p{color:var(--g2);font-size:14px;margin-top:6px}
  .stage{display:grid;grid-template-columns:1.5fr .9fr;gap:20px;align-items:start}
  .map{background:var(--sea);border:2px solid var(--brand);border-radius:16px;overflow:hidden;position:relative}
  svg{display:block;width:100%;height:auto}
  .pin{cursor:pointer}
  .pin circle{fill:var(--pin);stroke:#fff;stroke-width:2;transition:.2s}
  .pin text{fill:#fff;font-size:15px;font-weight:800;text-anchor:middle;pointer-events:none;font-family:-apple-system,"PingFang SC",sans-serif}
  .pin:hover circle,.pin.on circle{fill:var(--brand);r:20}
  .pin.on circle{fill:var(--gold)}
  .sea-lbl{fill:#3d7f92;font-size:13px;font-style:italic;font-family:Georgia,serif}
  .area-lbl{fill:#7a8a5a;font-size:11px;font-family:-apple-system,"PingFang SC",sans-serif;letter-spacing:.04em}
  .panel{background:#fff;border:2px solid var(--brand);border-radius:16px;padding:22px;min-height:320px;position:sticky;top:16px}
  .panel .idx{font-size:13px;color:var(--gold);font-weight:800;letter-spacing:.1em}
  .panel h2{font-size:30px;margin:6px 0 2px}
  .panel .sub{color:var(--g2);font-size:13px;margin-bottom:16px;font-style:italic}
  .spots{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
  .spots li{font-size:13px;background:#f3efe3;border:1px solid #e3dcc8;border-radius:8px;padding:6px 12px}
  .panel .tip{margin-top:18px;font-size:12px;color:var(--g2);border-top:1px dashed #ddd4c0;padding-top:12px}
  .legend{max-width:1160px;margin:18px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 clamp(16px,4vw,44px)}
  .lg{background:#fff;border:1px solid #e3dcc8;border-radius:12px;padding:14px}
  .lg b{font-size:13px;color:var(--brand)}.lg span{display:block;font-size:12px;color:var(--g2);margin-top:4px}
  footer{max-width:1160px;margin:26px auto 0;padding:0 clamp(16px,4vw,44px);font-size:12px;color:var(--g2)}
  @media(max-width:820px){.stage{grid-template-columns:1fr}.panel{position:static}.legend{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
  <div class="bar"><span class="k">南山八景 · 一张图</span><a href="review-wall.html">← 返回评审墙</a></div>
  <div class="wrap">
    <div class="head"><h1>八景一张图</h1><p>手绘示意地图 · 点任一点位，展开该景的代表景点（E-02 招牌原创交互）</p></div>
    <div class="stage">
      <div class="map">
        <svg viewBox="0 0 760 560" role="img" aria-label="南山八景示意地图">
          <!-- 陆域 -->
          <path d="M0 40 L760 40 L760 560 L120 560 C40 500 0 430 0 360 Z" fill="var(--land)"/>
          <!-- 海（深圳湾 / 伶仃洋）在左下 -->
          <path d="M0 360 C0 430 40 500 120 560 L0 560 Z" fill="var(--sea2)"/>
          <path d="M120 560 C220 520 300 500 360 470 L300 560 Z" fill="var(--sea2)" opacity=".8"/>
          <!-- 生态绿地（阳台山/塘朗山） -->
          <ellipse cx="300" cy="120" rx="120" ry="55" fill="var(--park)"/>
          <ellipse cx="540" cy="170" rx="90" ry="45" fill="var(--park)"/>
          <!-- 大沙河（一条河） -->
          <path d="M430 120 C420 240 400 330 360 430" fill="none" stroke="#5aa9c4" stroke-width="5" stroke-linecap="round"/>
          <!-- 西丽湖（一个湖） -->
          <ellipse cx="560" cy="270" rx="46" ry="28" fill="#8fcfe0"/>
          <!-- 深圳湾海岸线 -->
          <path d="M60 470 C220 430 380 430 560 450 C660 460 720 480 760 500" fill="none" stroke="#3d7f92" stroke-width="3" stroke-dasharray="2 6"/>
          <text class="sea-lbl" x="70" y="520">伶仃洋</text>
          <text class="sea-lbl" x="360" y="500">深圳湾</text>
          <text class="area-lbl" x="270" y="118">阳台山</text>
          <text class="area-lbl" x="525" y="272">西丽湖</text>
          <text class="area-lbl" x="415" y="220">大沙河</text>
          <!-- 8 点位（编号=景序） -->
          <g class="pin" data-i="0" tabindex="0"><circle cx="250" cy="330" r="18"/><text x="250" y="336">1</text></g>
          <g class="pin" data-i="1" tabindex="0"><circle cx="200" cy="440" r="18"/><text x="200" y="446">2</text></g>
          <g class="pin" data-i="2" tabindex="0"><circle cx="110" cy="300" r="18"/><text x="110" y="306">3</text></g>
          <g class="pin" data-i="3" tabindex="0"><circle cx="430" cy="410" r="18"/><text x="430" y="416">4</text></g>
          <g class="pin" data-i="4" tabindex="0"><circle cx="330" cy="450" r="18"/><text x="330" y="456">5</text></g>
          <g class="pin" data-i="5" tabindex="0"><circle cx="440" cy="300" r="18"/><text x="440" y="306">6</text></g>
          <g class="pin" data-i="6" tabindex="0"><circle cx="590" cy="230" r="18"/><text x="590" y="236">7</text></g>
          <g class="pin" data-i="7" tabindex="0"><circle cx="120" cy="470" r="18"/><text x="120" y="476">8</text></g>
        </svg>
      </div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </div>

    <div class="legend">
      <div class="lg"><b>一片海</b><span>深圳人才公园 · 43.7km 海岸线</span></div>
      <div class="lg"><b>一条河</b><span>大沙河生态长廊 13.7km</span></div>
      <div class="lg"><b>一座城</b><span>南头古城 · 近 1700 年</span></div>
      <div class="lg"><b>一个湖</b><span>环西丽湖碧道 15.5km</span></div>
    </div>

    <footer>s11 · 八景一张图（手绘 SVG 地图点位交互）｜ 数据来源：创新南山「南山八景」2026-09 揭晓 · 深圳市南山区人民政府（点位为示意位置，非精确地理坐标）</footer>
  </div>

<script>
const S=[
 {n:'古城宁南',s:'人文之韵 · 近 1700 年',p:['南头古城','中山公园','荷兰花卉小镇']},
 {n:'蛇口记忆',s:'改革开放的地标群',p:['微波山时间广场','招商局历史博物馆','海上世界','蛇口老街','南海意库','价值工厂','蛇口邮轮母港','K11 ECOAST']},
 {n:'前海观潮',s:'深港合作的前沿',p:['前海石公园','前海博物馆','前海展示厅','前海国际会议中心','万象前海']},
 {n:'后海逐浪',s:'总部经济与湾区客厅',p:['深圳湾文化广场','深圳湾体育中心','深圳人才公园','中国华润大厦','海岸城','深圳湾大街','万象城']},
 {n:'深湾驭风',s:'滨海绿道与超级总部',p:['深圳湾公园','深圳湾滨海绿道','深圳湾大桥','深圳湾超级总部基地']},
 {n:'燕晗栖羽',s:'湿地与创意文化',p:['大沙河长廊','华侨城创意文化园','华侨城国家湿地公园','烟火石洲美食街','欢乐谷','世界之窗','锦绣中华','欢乐海岸']},
 {n:'丽湖留仙',s:'科教与总部高地',p:['西丽湖','西丽湖国际科教城','留仙湖','留仙洞总部基地']},
 {n:'伶仃烟渚',s:'山海与历史回响',p:['赤湾天后宫','大小南山','宋少帝陵','左炮台','内伶仃岛','大铲岛','孖洲岛']},
];
const panel=document.getElementById('panel'),pins=document.querySelectorAll('.pin');
function show(i){
  pins.forEach(p=>p.classList.toggle('on',+p.dataset.i===i));
  const d=S[i];
  panel.innerHTML=`<div class="idx">南山八景 · 第 ${i+1} 景</div><h2>${d.n}</h2><div class="sub">${d.s}</div>
   <ul class="spots">${d.p.map(x=>`<li>${x}</li>`).join('')}</ul>
   <div class="tip">💡 正式实现里，这里会联动地图片区高亮 + 数据驱动的八景详情路由（#/02-nanshan/scene/:id）。</div>`;
}
pins.forEach(p=>{p.addEventListener('click',()=>show(+p.dataset.i));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(+p.dataset.i)}})});
show(3);
</script>
</body>
</html>
