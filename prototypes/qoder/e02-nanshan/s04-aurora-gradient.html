<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-02 南山名片 · s04 极光渐变</title>
<style>
  :root{--ink:#fff;--g2:rgba(255,255,255,.78)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC",sans-serif;color:var(--ink);line-height:1.6;min-height:100vh;
    background:#05060f;position:relative;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .aur{position:fixed;border-radius:50%;filter:blur(80px);opacity:.6;z-index:0;pointer-events:none}
  .a1{width:55vw;height:55vw;left:-10vw;top:-10vw;background:radial-gradient(circle,#ff5f6d,#ff2e63)}
  .a2{width:60vw;height:60vw;right:-15vw;top:5vw;background:radial-gradient(circle,#4776e6,#8e54e9)}
  .a3{width:50vw;height:50vw;left:20vw;bottom:-20vw;background:radial-gradient(circle,#00c9ff,#00e5a0)}
  .bar{position:relative;z-index:2;display:flex;justify-content:space-between;padding:20px clamp(20px,5vw,56px);color:var(--g2);font-size:14px}
  .hero{position:relative;z-index:2;text-align:center;padding:clamp(50px,14vh,140px) 20px 60px}
  .hero .k{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--g2)}
  .hero h1{font-size:clamp(38px,10vw,110px);font-weight:800;letter-spacing:-.02em;line-height:.95;margin:14px 0;
    background:linear-gradient(100deg,#ffd93d,#ff5f6d 40%,#a166ff 70%,#00d4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--g2);max-width:46ch;margin:0 auto;font-size:clamp(15px,2vw,19px)}
  .cards{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1100px;margin:0 auto;padding:20px clamp(20px,5vw,56px)}
  .c{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:22px;backdrop-filter:blur(6px)}
  .c .b{font-size:30px;font-weight:800}
  .c .l{font-size:13px;color:var(--g2);margin-top:6px}
  .scenes{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;margin:40px auto 0;padding:0 20px}
  .chip{border:1px solid rgba(255,255,255,.28);padding:9px 18px;border-radius:999px;font-size:14px;background:rgba(255,255,255,.06)}
  .chip:hover{background:rgba(255,255,255,.18)}
  footer{position:relative;z-index:2;text-align:center;color:var(--g2);font-size:13px;padding:50px 20px}
  @media(max-width:820px){.cards{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div>
  <div class="bar"><span>NANSHAN</span><a href="review-wall.html">← 返回评审墙</a></div>
  <section class="hero">
    <div class="k">Shenzhen Bay · 晨光天际线</div>
    <h1>绿美南山</h1>
    <p>深圳湾上空的极光式渐变，是这座滨海城区一天开始的颜色。八景、山海与科创在同一片光里铺展。</p>
  </section>
  <section class="cards">
    <div class="c"><div class="b">1.01万亿</div><div class="l">GDP · 全国首个万亿地市辖区</div></div>
    <div class="c"><div class="b">43.7 km</div><div class="l">黄金海岸线</div></div>
    <div class="c"><div class="b">6037</div><div class="l">国家高新技术企业</div></div>
    <div class="c"><div class="b">218</div><div class="l">上市公司 · 密度全国第一</div></div>
  </section>
  <section class="scenes">
    <span class="chip">古城宁南</span><span class="chip">蛇口记忆</span><span class="chip">前海观潮</span>
    <span class="chip">后海逐浪</span><span class="chip">深湾驭风</span><span class="chip">燕晗栖羽</span>
    <span class="chip">丽湖留仙</span><span class="chip">伶仃烟渚</span>
  </section>
  <footer>s04 · Aurora UI · 极光渐变 ｜ 资料来源：深圳市南山区人民政府 / 创新南山 / 经济日报（数据以官方口径为准）</footer>
</body>
</html>
