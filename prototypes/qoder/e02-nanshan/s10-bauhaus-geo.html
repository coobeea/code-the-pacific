<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-02 南山名片 · s10 包豪斯几何</title>
<style>
  :root{--red:#e63946;--blue:#1d3557;--yellow:#ffcb3d;--cream:#f4ede0;--ink:#1a1a1a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Futura","Arial Black","PingFang SC",sans-serif;background:var(--cream);color:var(--ink);line-height:1.4}
  a{text-decoration:none;color:inherit}
  .bar{display:flex;justify-content:space-between;padding:14px clamp(16px,4vw,40px);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .wrap{max-width:1080px;margin:0 auto;padding:clamp(16px,4vw,40px)}
  .hero{display:grid;grid-template-columns:1.2fr .8fr;gap:0;border:4px solid var(--ink);background:#fff}
  .hero .txt{padding:clamp(24px,5vw,56px)}
  .hero .txt .k{font-size:14px;letter-spacing:.2em;color:var(--red);font-weight:700}
  .hero h1{font-size:clamp(34px,7vw,72px);line-height:.95;font-weight:900;margin:12px 0 16px;text-transform:uppercase}
  .hero p{font-size:16px;max-width:40ch}
  .shapes{position:relative;background:var(--yellow);min-height:280px;overflow:hidden}
  .circle{position:absolute;width:160px;height:160px;border-radius:50%;background:var(--red)}
  .tri{position:absolute;width:0;height:0;border-left:80px solid transparent;border-right:80px solid transparent;border-bottom:140px solid var(--blue);bottom:0;right:20px}
  .rect{position:absolute;width:120px;height:120px;background:var(--blue);top:20px;right:20px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
  .cell{border:3px solid var(--ink);aspect-ratio:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;font-weight:700;position:relative;overflow:hidden;background:#fff}
  .cell .n{font-size:12px;letter-spacing:.1em}
  .cell .t{font-size:18px;text-transform:uppercase}
  .c1{background:var(--red);color:#fff}.c2{background:var(--blue);color:#fff}.c3{background:var(--yellow)}.c4{background:#7fb069}
  .strip{display:flex;gap:0;border:4px solid var(--ink);margin-top:16px;background:var(--ink);color:#fff}
  .strip div{flex:1;padding:16px;text-align:center;font-weight:900}
  .strip small{display:block;font-size:12px;font-weight:400;opacity:.8;margin-top:4px}
  footer{text-align:center;font-weight:700;font-size:12px;margin-top:28px;letter-spacing:.06em}
  @media(max-width:820px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.strip{flex-wrap:wrap}.strip div{flex:1 1 50%}}
</style>
</head>
<body>
  <div class="bar"><span>NANSHAN 几何名片</span><a href="review-wall.html">← 评审墙</a></div>
  <div class="wrap">
    <section class="hero">
      <div class="txt">
        <div class="k">BAUHAUS · 包豪斯构成</div>
        <h1>山海<br>连城</h1>
        <p>用圆、三角、方三种基本形，拼出南山的"一海一河一城一湖"。原色、粗黑边、强几何构成。</p>
      </div>
      <div class="shapes">
        <div class="circle"></div><div class="rect"></div><div class="tri"></div>
      </div>
    </section>

    <section class="grid">
      <div class="cell c1"><span class="n">SEA</span><span class="t">一片海</span></div>
      <div class="cell c2"><span class="n">RIVER</span><span class="t">一条河</span></div>
      <div class="cell c3"><span class="n">CITY</span><span class="t">一座城</span></div>
      <div class="cell c4"><span class="n">LAKE</span><span class="t">一个湖</span></div>
    </section>

    <section class="strip">
      <div>1.01万亿<small>南山 GDP</small></div>
      <div>218<small>上市公司</small></div>
      <div>6037<small>国家高企</small></div>
      <div>43.7km<small>海岸线</small></div>
    </section>
  </div>
  <footer>s10 · Bauhaus 包豪斯几何 ｜ 资料来源：创新南山「南山八景」/ 深圳市南山区人民政府（数据以官方口径为准）</footer>
</body>
</html>
