<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-01 峰会资讯 · s04 动力字体</title>
<style>
  :root{--ink:#0a0a0a;--bg:#f5f2ea;--red:#c81e2c;--blue:#0a3d62}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1;font-weight:900;overflow-x:hidden}
  a{text-decoration:none;color:inherit}
  .bar{display:flex;justify-content:space-between;padding:16px clamp(16px,4vw,48px);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8a8577}
  .stage{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;position:relative}
  .kicker{font-size:14px;letter-spacing:.4em;color:var(--red);font-weight:700;margin-bottom:30px}
  .cycle{font-size:clamp(64px,18vw,240px);letter-spacing:-.03em;height:1.1em;overflow:hidden;position:relative}
  .cycle span{display:block;animation:rise 6s infinite}
  .cycle span:nth-child(1){animation-delay:0s}.cycle span:nth-child(2){animation-delay:2s;color:var(--blue)}.cycle span:nth-child(3){animation-delay:4s;color:var(--red)}
  @keyframes rise{0%{transform:translateY(100%);opacity:0}8%,28%{transform:translateY(0);opacity:1}36%,100%{transform:translateY(-100%);opacity:0}}
  .track{font-size:clamp(16px,3vw,28px);font-weight:400;letter-spacing:.05em;color:#3a3a3a;margin-top:24px;font-family:"Songti SC",Georgia,serif}
  .marquee{white-space:nowrap;overflow:hidden;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:12px 0;font-size:20px;letter-spacing:.02em}
  .marquee div{display:inline-block;padding-left:100%;animation:scroll 22s linear infinite}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  @media(prefers-reduced-motion:reduce){.cycle span{animation:none;opacity:1}.marquee div{animation:none;padding-left:0}}
  footer{padding:22px clamp(16px,4vw,48px);font-size:12px;color:#8a8577;font-weight:400;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;letter-spacing:.02em}
</style>
</head>
<body>
  <div class="bar"><span>APEC 2026 · 优先领域</span><a href="review-wall.html">评审墙</a></div>
  <section class="stage">
    <div class="kicker">三大优先领域</div>
    <div class="cycle"><span>开放</span><span>创新</span><span>合作</span></div>
    <div class="track">亚太繁荣的生命线 · 动力源 · 基本盘</div>
  </section>
  <div class="marquee"><div>建设亚太共同体，促进共同繁荣 &nbsp;·&nbsp; Building an Asia-Pacific Community To Prosper Together &nbsp;·&nbsp; 2026.11.18—19 深圳 &nbsp;·&nbsp; 乘大势 共翱翔 &nbsp;·&nbsp; 开放 创新 合作 &nbsp;·&nbsp;</div></div>
  <footer><span>s04 · Kinetic Typography 动力字体</span><span>南山视角：主办城区为南山 · 资料来源：新华社 / 中国政府网 / APEC 官网</span></footer>
</body>
</html>
