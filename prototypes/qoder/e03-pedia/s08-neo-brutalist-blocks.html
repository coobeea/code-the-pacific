<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-03 亚太经济体百科 · s08 新粗野色块</title>
<style>
  :root{--bg:#fdf6e3;--ink:#111;--red:#ff5d5d;--yel:#ffd93d;--vio:#c4b5fd;--grn:#7ed957;--blu:#5db4ff;--card:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Arial Black","Helvetica Neue","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.3}
  a{text-decoration:none;color:inherit}
  .bar{display:flex;justify-content:space-between;padding:16px clamp(16px,4vw,40px);font-weight:900;font-size:14px;text-transform:uppercase}
  .wrap{max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 50px}
  .head{border:4px solid var(--ink);background:var(--yel);padding:24px;margin-bottom:24px;box-shadow:8px 8px 0 var(--ink);transform:rotate(-.4deg)}
  .head h1{font-size:clamp(28px,6vw,54px);font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
  .head p{font-family:Arial,"PingFang SC",sans-serif;font-weight:700;margin-top:10px;max-width:52ch;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .b{border:3px solid var(--ink);background:var(--card);padding:18px;box-shadow:6px 6px 0 var(--ink);transition:.12s;position:relative}
  .b:nth-child(odd){transform:rotate(-1deg)}
  .b:nth-child(even){transform:rotate(1deg)}
  .b:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
  .b .code{position:absolute;top:-14px;left:14px;font-size:12px;font-weight:900;background:var(--ink);color:var(--yel);padding:3px 10px;transform:rotate(-2deg)}
  .b .n{font-size:22px;font-weight:900;margin-top:6px}
  .b .en{font-family:Arial,"PingFang SC",sans-serif;font-weight:400;font-size:13px;color:#444;margin-top:2px}
  .b .rg{display:inline-block;margin-top:12px;font-size:12px;font-weight:900;padding:4px 10px;border:2px solid var(--ink)}
  .r1{background:var(--red);color:#fff}.r2{background:var(--vio)}.r3{background:var(--grn)}.r4{background:var(--blu)}.r5{background:var(--yel)}
  .badge{position:absolute;bottom:-12px;right:10px;font-size:11px;font-weight:900;background:#fff;border:2px solid var(--ink);padding:2px 8px;transform:rotate(2deg)}
  footer{max-width:1100px;margin:0 auto;text-align:center;font-weight:900;font-size:12px;padding:16px}
  @media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="bar"><span>APEC 21 // BLOCKS</span><a href="review-wall.html">← 评审墙</a></div>
  <div class="wrap">
    <div class="head"><h1>亚太 21 · 色块百科</h1><p>厚边框 + 硬阴影 + 高饱和色块，把 21 个成员经济体做成好记的贴纸。颜色按区域强区分。表述规范：中国香港、中国台北。</p></div>
    <div class="grid" id="grid"></div>
  </div>
  <div style="max-width:1100px;margin:26px auto 0;padding:18px;border:3px solid var(--ink);box-shadow:6px 6px 0 #0d9488;background:#fff">
    <div style="font-size:15px;font-weight:900;color:#0d9488;text-transform:uppercase;margin-bottom:8px">南山视角 // NANSHAN NODE</div>
    <div style="font-family:Arial,'PingFang SC',sans-serif;font-weight:700;font-size:14px;line-height:1.55">21 个经济体环太平洋而居，深圳南山是其中一个活跃的枢纽：前海深港合作区 · 深圳西部港区 · 腾讯/中兴/大疆企业总部。（来源：深圳市南山区人民政府）</div>
  </div>
  <footer>s08 · Neo-Brutalism 新粗野色块 ｜ 资料来源：APEC 官网 Our members / 工信部</footer>
<script>
const D=[['澳大利亚','Australia','大洋洲',1989],['中国','China','东亚',1991],['中国香港','H.K., China','东亚',1991],
 ['中国台北','Chinese Taipei','东亚',1991],['日本','Japan','东亚',1989],['韩国','Korea','东亚',1989],
 ['新加坡','Singapore','东南亚',1989],['泰国','Thailand','东南亚',1989],['越南','Viet Nam','东南亚',1998],
 ['美国','U.S.','北美',1989],['加拿大','Canada','北美',1989],['墨西哥','Mexico','北美',1993],
 ['智利','Chile','南美',1994],['秘鲁','Peru','南美',1998],['俄罗斯','Russia','欧亚',1998]];
const RC={'东亚':'r1','东南亚':'r2','北美':'r3','南美':'r4','大洋洲':'r5','欧亚':'r1'};
document.getElementById('grid').innerHTML=D.map(d=>`<div class="b"><span class="code">${d[2]}</span><div class="n">${d[0]}</div><div class="en">${d[1]}</div><div class="rg ${RC[d[2]]}">${d[2]}</div><span class="badge">加入 ${d[3]}</span></div>`).join('');
</script>
</body>
</html>
